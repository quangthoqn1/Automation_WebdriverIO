name: Run WebdriverIO Tests

on:
  workflow_dispatch:
    inputs:
      spec:
        description: 'File test cần chạy (VD: tests/specs/example.e2e.js)'
        required: true
        default: 'tests/specs'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx wdio run wdio.conf.js --spec ${{ github.event.inputs.spec }}

      - name: Install Allure CLI and Generate report
        run: |
          npm install -g allure-commandline --no-save
          npx allure generate allure-results --clean -o allure-report

      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
